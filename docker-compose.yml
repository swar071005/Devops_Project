services:
  mysql:
    image: mysql:8.4
    container_name: devops-mysql
    environment:
      MYSQL_DATABASE: book_system
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: devops-book-system
    depends_on:
      - mysql
    environment:
      DB_URL: jdbc:mysql://mysql:3306/book_system
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"

volumes:
  mysql_data:
