<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Books</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav>
    <div class="brand">📚 Devops_Project</div>
    <div><a href="/">Dashboard</a><a href="/books">Books</a><a href="/issue">Issue Book</a><a href="/issues">Records</a></div>
</nav>
<main>
    <div class="page-head">
        <div><h1>Book Management</h1><p class="subtitle">Create, view, update and search books.</p></div>
        <a class="button" href="/books/new">+ Add New Book</a>
    </div>

    <form class="search" method="get" action="/books">
        <input name="q" th:value="${q}" placeholder="Search by title or author">
        <button type="submit">Search</button>
        <a href="/books">Clear</a>
    </form>

    <div th:if="${param.success}" class="success" th:text="${param.success}"></div>

    <div class="table-wrap">
    <table>
        <thead><tr><th>ID</th><th>Title</th><th>Author</th><th>ISBN</th><th>Category</th><th>Available</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}">1</td>
            <td th:text="${book.title}">Java</td>
            <td th:text="${book.author}">Author</td>
            <td th:text="${book.isbn}">123</td>
            <td th:text="${book.category}">Programming</td>
            <td th:text="${book.availableQuantity + ' / ' + book.quantity}">4 / 5</td>
            <td>
                <a class="small-button" th:href="@{/books/edit/{id}(id=${book.id})}">Edit</a>
                <a class="small-button danger" th:href="@{/books/delete/{id}(id=${book.id})}" onclick="return confirm('Delete this book?')">Delete</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(books)}"><td colspan="7" class="empty">No books found.</td></tr>
        </tbody>
    </table>
    </div>
</main>
</body>
</html>
