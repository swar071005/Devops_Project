<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue Book - DevOps Library</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a th:href="@{/}" class="brand-logo">📚 DevOps Library</a>
            <nav class="nav-links">
                <a th:href="@{/}">Dashboard</a>
                <a th:href="@{/books}">Books</a>
                <a th:href="@{/books/new}">Add Book</a>
                <a th:href="@{/issues/new}" class="active">Issue Book</a>
                <a th:href="@{/issues}">Issue History</a>
                <a th:href="@{/health}" target="_blank" class="badge-link">Health Check</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="card form-container">
            <h2>Issue Book to Student</h2>
            <form th:action="@{/issues/save}" method="post">
                <div class="form-group">
                    <label for="bookSelect">Select Book <span class="required">*</span></label>
                    <select id="bookSelect" name="bookId" class="form-control" required>
                        <option value="">-- Choose a book --</option>
                        <option th:each="b : ${books}" 
                                th:value="${b.id}" 
                                th:text="${b.title + ' (by ' + b.author + ')'}" 
                                th:selected="${selectedBookId != null and selectedBookId == b.id}">
                            Book Title
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="studentName">Student / Borrower Name <span class="required">*</span></label>
                    <input type="text" id="studentName" name="studentName" class="form-control" placeholder="Enter student full name" required>
                </div>

                <div class="form-group">
                    <label for="studentId">Student Roll No / ID <span class="required">*</span></label>
                    <input type="text" id="studentId" name="studentId" class="form-control" placeholder="e.g. 23104B0023" required>
                </div>

                <div class="form-group">
                    <label for="issueDate">Issue Date</label>
                    <input type="date" id="issueDate" name="issueDate" class="form-control">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Confirm Issue</button>
                    <a th:href="@{/books}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 DevOps Book Issue & Return System | Academic Project</p>
    </footer>
</body>
</html>
