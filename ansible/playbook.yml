---
- name: Configure and deploy Devops_Project
  hosts: app
  become: false

  vars:
    app_name: devops-book-system
    app_port: 8080

  tasks:
    - name: Create application directory
      ansible.builtin.file:
        path: /opt/{{ app_name }}
        state: directory
        mode: '0755'

    - name: Show deployment target
      ansible.builtin.debug:
        msg: "Application will run on port {{ app_port }}"

    # Add Docker installation, image pull and container deployment
    # tasks here when running on a Linux deployment node.
